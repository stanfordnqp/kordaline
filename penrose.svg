<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" role="img" aria-labelledby="title desc">
  <title id="title">Maximally extended Schwarzschild spacetime</title>
  <desc id="desc">Compactified Kruskal–Szekeres diagram with two exterior regions, four horizon branches, and spacelike singularities.</desc>
  <metadata>Diagonal boundaries and horizons are radial null lines. Zigzags are the future and past spacelike r=0 curvature singularities. Lighter conformal grids are confined to the two asymptotically flat exterior regions; they are not worldlines.</metadata>
  <g fill="none" stroke="#365d73" stroke-linecap="round" stroke-linejoin="round">
    <!-- Separate conformal grids in exterior regions I and III. -->
    <g stroke-width="1.25" opacity=".48">
      <path d="M68 10C38 34 38 106 68 130M68 10C54 38 54 102 68 130M68 10C82 38 82 102 68 130M68 10C98 34 98 106 68 130"/>
      <path d="M8 70Q64 38 120 70M8 70Q64 54 120 70M8 70h112M8 70Q64 86 120 70M8 70Q64 102 120 70"/>
      <path d="M172 10C142 34 142 106 172 130M172 10C158 38 158 102 172 130M172 10C186 38 186 102 172 130M172 10C202 34 202 106 172 130"/>
      <path d="M120 70Q176 38 232 70M120 70Q176 54 232 70M120 70h112M120 70Q176 86 232 70M120 70Q176 102 232 70"/>
    </g>
    <!-- Scri and four event-horizon branches: all radial null lines. -->
    <g stroke-width="2">
      <path d="M68 10 8 70l60 60M172 10l60 60-60 60"/>
      <path d="M68 10l52 60 52-60M68 130l52-60 52 60"/>
    </g>
    <!-- Spacelike r=0 curvature singularities. -->
    <g stroke-width="2.25">
      <path d="M68 10L72 6 76 14 80 6 84 14 88 6 92 14 96 6 100 14 104 6 108 14 112 6 116 14 120 6 124 14 128 6 132 14 136 6 140 14 144 6 148 14 152 6 156 14 160 6 164 14 168 6 172 10"/>
      <path d="M68 130L72 134 76 126 80 134 84 126 88 134 92 126 96 134 100 126 104 134 108 126 112 134 116 126 120 134 124 126 128 134 132 126 136 134 140 126 144 134 148 126 152 134 156 126 160 134 164 126 168 134 172 130"/>
    </g>
  </g>
</svg>
